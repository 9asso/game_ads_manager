include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - public_member_api_docs
    - prefer_final_fields
    - prefer_final_locals
    - avoid_print
    - unawaited_futures
    - cancel_subscriptions
    - always_declare_return_types
